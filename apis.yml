name: Typesense
description: Typesense is a fast, typo-tolerant, open-source search engine designed
  for developer productivity. It provides instant search experiences with support
  for full-text search, faceting, filtering, sorting, geo-based search, vector search,
  and conversational AI search. Typesense is available as an open-source self-hosted
  solution or as a managed cloud service via Typesense Cloud.
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
