apis:
- name: Typesense Search API
  description: >-
    The core Typesense REST API for managing collections, indexing documents, and performing full-text,
    faceted, filtered, sorted, geo-based, and multi-search queries. Supports synonym sets, curation sets,
    collection aliases, stopwords, presets, stemming dictionaries, API keys, and cluster operations.
  image: https://typesense.org/favicon-32x32.png
  humanURL: https://typesense.org/docs/
  baseURL: http://localhost:8108
  tags:
  - Collections
  - Documents
  - Full-Text Search
  - Search
  properties:
