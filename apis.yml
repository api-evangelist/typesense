  - url: graphql/typesense-graphql.md
    type: GraphQL
- name: Typesense Vector Search API
  description: >-
    The Typesense Vector Search API extends the core search capabilities with vector and hybrid search.
    It supports indexing embedding fields, querying by vector proximity, and combining semantic vector
    search with keyword search for superior relevance.
  image: https://typesense.org/favicon-32x32.png
  humanURL: https://typesense.org/docs/guide/vector-search.html
  baseURL: http://localhost:8108
  tags:
  - Embeddings
  - Hybrid Search
  - Semantic Search
  - Vector Search
  properties:
  - type: Documentation
    url: https://typesense.org/docs/guide/vector-search.html
  - type: OpenAPI
    url: openapi/typesense-vector-search-api-openapi.yml
- name: Typesense Conversational Search API
  description: >-
    The Typesense Conversational Search API enables AI-powered question answering over your search index.
    It supports conversation models (OpenAI, Cloudflare Workers AI), NL search models, and stateful multi-turn
    conversations over indexed data.
  image: https://typesense.org/favicon-32x32.png
  humanURL: https://typesense.org/docs/guide/conversational-search-rag.html
  baseURL: http://localhost:8108
