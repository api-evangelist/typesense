naftiko: 1.0.0-alpha2
info:
  label: Typesense Analytics API — Analytics Events
  description: 'Typesense Analytics API — Analytics Events. 2 operations. Lead operation: Log An Analytics Event. Self-contained
    Naftiko capability covering one Typesense business surface.'
  tags:
  - Typesense
  - Analytics Events
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TYPESENSE_API_KEY: TYPESENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: analytics-analytics-events
    baseUri: ''
    description: Typesense Analytics API — Analytics Events business capability. Self-contained, no shared references.
    resources:
    - name: analytics-events
      path: /analytics/events
      operations:
      - name: createanalyticsevent
        method: POST
        description: Log An Analytics Event
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listanalyticsevents
        method: GET
        description: Retrieve Analytics Events
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: query
          type: string
          description: Filter events by type (click, conversion, visit).
    authentication:
      type: apikey
      key: X-TYPESENSE-API-KEY
      value: '{{env.TYPESENSE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: analytics-analytics-events-rest
    port: 8080
    description: REST adapter for Typesense Analytics API — Analytics Events. One Spectral-compliant resource per consumed
      operation, prefixed with /v1.
    resources:
    - path: /v1/analytics/events
      name: analytics-events
      description: REST surface for analytics-events.
      operations:
      - method: POST
        name: createanalyticsevent
        description: Log An Analytics Event
        call: analytics-analytics-events.createanalyticsevent
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: GET
        name: listanalyticsevents
        description: Retrieve Analytics Events
        call: analytics-analytics-events.listanalyticsevents
        with:
          type: rest.type
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: analytics-analytics-events-mcp
    port: 9090
    transport: http
    description: MCP adapter for Typesense Analytics API — Analytics Events. One tool per consumed operation, routed inline
      through this capability's consumes block.
    tools:
    - name: log-analytics-event
      description: Log An Analytics Event
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: analytics-analytics-events.createanalyticsevent
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-analytics-events
      description: Retrieve Analytics Events
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: analytics-analytics-events.listanalyticsevents
      with:
        type: tools.type
      outputParameters:
      - type: object
        mapping: $.
