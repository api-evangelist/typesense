naftiko: 1.0.0-alpha2
info:
  label: Typesense Search API — Stemming
  description: 'Typesense Search API — Stemming. 3 operations. Lead operation: List Stemming Dictionaries. Self-contained
    Naftiko capability covering one Typesense business surface.'
  tags:
  - Typesense
  - Stemming
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TYPESENSE_API_KEY: TYPESENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: search-stemming
    baseUri: ''
    description: Typesense Search API — Stemming business capability. Self-contained, no shared references.
    resources:
    - name: stemming-dictionaries
      path: /stemming/dictionaries
      operations:
      - name: liststemmingdictionaries
        method: GET
        description: List Stemming Dictionaries
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: stemming-dictionaries-import
      path: /stemming/dictionaries/import
      operations:
      - name: importstemmingdictionary
        method: POST
        description: Import A Stemming Dictionary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: stemming-dictionaries-dictionaryId
      path: /stemming/dictionaries/{dictionaryId}
      operations:
      - name: getstemmingdictionary
        method: GET
        description: Retrieve A Stemming Dictionary
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-TYPESENSE-API-KEY
      value: '{{env.TYPESENSE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: search-stemming-rest
    port: 8080
    description: REST adapter for Typesense Search API — Stemming. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/stemming/dictionaries
      name: stemming-dictionaries
      description: REST surface for stemming-dictionaries.
      operations:
      - method: GET
        name: liststemmingdictionaries
        description: List Stemming Dictionaries
        call: search-stemming.liststemmingdictionaries
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stemming/dictionaries/import
      name: stemming-dictionaries-import
      description: REST surface for stemming-dictionaries-import.
      operations:
      - method: POST
        name: importstemmingdictionary
        description: Import A Stemming Dictionary
        call: search-stemming.importstemmingdictionary
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/stemming/dictionaries/{dictionaryid}
      name: stemming-dictionaries-dictionaryid
      description: REST surface for stemming-dictionaries-dictionaryId.
      operations:
      - method: GET
        name: getstemmingdictionary
        description: Retrieve A Stemming Dictionary
        call: search-stemming.getstemmingdictionary
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: search-stemming-mcp
    port: 9090
    transport: http
    description: MCP adapter for Typesense Search API — Stemming. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: list-stemming-dictionaries
      description: List Stemming Dictionaries
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: search-stemming.liststemmingdictionaries
      outputParameters:
      - type: object
        mapping: $.
    - name: import-stemming-dictionary
      description: Import A Stemming Dictionary
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: search-stemming.importstemmingdictionary
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: retrieve-stemming-dictionary
      description: Retrieve A Stemming Dictionary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: search-stemming.getstemmingdictionary
      outputParameters:
      - type: object
        mapping: $.
