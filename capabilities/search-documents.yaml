      key: X-TYPESENSE-API-KEY
      value: '{{env.TYPESENSE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: search-documents-rest
    port: 8080
    description: REST adapter for Typesense Search API — Documents. One Spectral-compliant resource per consumed operation,
