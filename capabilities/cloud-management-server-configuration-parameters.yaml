naftiko: 1.0.0-alpha2
info:
  label: Typesense Cloud Management API — Server Configuration Parameters
  description: 'Typesense Cloud Management API — Server Configuration Parameters. 2 operations. Lead operation: Get Server
    Configuration Parameters. Self-contained Naftiko capability covering one Typesense business surface.'
  tags:
  - Typesense
  - Server Configuration Parameters
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TYPESENSE_API_KEY: TYPESENSE_API_KEY
capability:
  consumes:
  - type: http
    namespace: cloud-management-server-configuration-parameters
    baseUri: https://cloud.typesense.org/api/v1
    description: Typesense Cloud Management API — Server Configuration Parameters business capability. Self-contained, no
      shared references.
    resources:
    - name: clusters-clusterId-typesense-server-configuration-parameters
      path: /clusters/{clusterId}/typesense-server-configuration-parameters
      operations:
      - name: getserverconfigurationparameters
        method: GET
        description: Get Server Configuration Parameters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
      - name: updateserverconfigurationparameters
        method: PATCH
        description: Update Server Configuration Parameters
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: X-TYPESENSE-CLOUD-MANAGEMENT-API-KEY
      value: '{{env.TYPESENSE_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: cloud-management-server-configuration-parameters-rest
    port: 8080
    description: REST adapter for Typesense Cloud Management API — Server Configuration Parameters. One Spectral-compliant
      resource per consumed operation, prefixed with /v1.
    resources:
    - path: /v1/clusters/{clusterid}/typesense-server-configuration-parameters
      name: clusters-clusterid-typesense-server-configuration-parameters
      description: REST surface for clusters-clusterId-typesense-server-configuration-parameters.
      operations:
      - method: GET
        name: getserverconfigurationparameters
        description: Get Server Configuration Parameters
        call: cloud-management-server-configuration-parameters.getserverconfigurationparameters
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateserverconfigurationparameters
        description: Update Server Configuration Parameters
        call: cloud-management-server-configuration-parameters.updateserverconfigurationparameters
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: cloud-management-server-configuration-parameters-mcp
    port: 9090
    transport: http
    description: MCP adapter for Typesense Cloud Management API — Server Configuration Parameters. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: get-server-configuration-parameters
      description: Get Server Configuration Parameters
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: cloud-management-server-configuration-parameters.getserverconfigurationparameters
      outputParameters:
      - type: object
        mapping: $.
    - name: update-server-configuration-parameters
      description: Update Server Configuration Parameters
      hints:
        readOnly: false
        destructive: false
        idempotent: true
      call: cloud-management-server-configuration-parameters.updateserverconfigurationparameters
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
